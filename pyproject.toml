[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "complyscope"
dynamic = ["version"]
description = "Open-source compliance-as-code for SMEs: automated evidence, control mapping and risk registers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Abdullah Omer Bayirbasi", email = "bayirbasio@gmail.com" }]
requires-python = ">=3.11"
keywords = ["grc", "compliance", "cyber-essentials", "iso27001", "nist-csf", "risk-register"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "click>=8.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.1",
]

[project.scripts]
complyscope = "complyscope.cli:cli"

[project.urls]
Repository = "https://github.com/omerbyrb/complyscope"
Issues = "https://github.com/omerbyrb/complyscope/issues"

[tool.hatch.version]
path = "src/complyscope/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/complyscope"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
