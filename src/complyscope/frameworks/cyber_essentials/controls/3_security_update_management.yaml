# Aim: devices and software are not vulnerable to known issues that already have fixes.
controls:
  - id: CE-SU-01
    theme: security_update_management
    title: All in-scope software is licensed and supported
    description: >-
      The organisation has the right to use every piece of software, and its vendor
      still provides vulnerability fixes and has published an end-of-support date.
    assessment: hybrid
    # A service banner showing end-of-life software.
    evidence:
      - source: redscope
        check: banner.eol_software
    crosswalk:
      iso27001-2022: [A.8.8]
      nist-csf-2.0: [PR.PS-02]

  - id: CE-SU-02
    theme: security_update_management
    title: Unsupported software is removed or isolated
    description: >-
      Software that reaches end of support is uninstalled, or the devices running it
      are moved into a separate sub-set with no traffic to or from the internet.
    assessment: hybrid
    # End-of-life software still reachable from the internet.
    evidence:
      - source: redscope
        check: banner.eol_software
    crosswalk:
      iso27001-2022: [A.8.8]
      nist-csf-2.0: [PR.PS-02]

  - id: CE-SU-03
    theme: security_update_management
    title: Automatic updates are enabled where possible
    assessment: questionnaire
    crosswalk:
      iso27001-2022: [A.8.8]
      nist-csf-2.0: [PR.PS-02]

  - id: CE-SU-04
    theme: security_update_management
    title: Critical and high-risk updates are applied within 14 days
    description: >-
      Updates are installed within 14 days of release when the vendor rates them
      critical or high risk, when they fix vulnerabilities with a CVSS v3 base score of
      7 or more, or when the vendor gives no severity at all. A bundled update that
      fixes any such issue counts as critical.
    assessment: hybrid
    # A known CVE in a detected version suggests a missed update. The 14-day window itself
    # needs patch records, which the questionnaire will ask for (week 5).
    evidence:
      - source: redscope
        check: cvelookup.known_vulnerability
    crosswalk:
      iso27001-2022: [A.8.8]
      nist-csf-2.0: [ID.RA-01, PR.PS-02]
